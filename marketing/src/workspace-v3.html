<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NextMind Desktop V3 workspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="canvas v3-grid" style="width:1600px;height:900px">
  <div class="abs wordmark" style="left:62px;top:48px;font-size:27px">NextMind <span>Desktop</span></div>
  <div class="abs micro" style="right:62px;top:54px">Future Workspace · V3</div>
  <div class="rule" style="left:62px;right:62px;top:100px"></div>

  <div class="abs" style="left:62px;top:124px;font-size:31px;font-weight:300;color:#eef6ff">Deep Work</div>
  <div class="abs sub" style="left:62px;top:168px;font-size:18px">Synthetic demonstration workspace · local-only</div>

  <img class="capture" src="../source-images/v3-components/focus-zone.png" style="left:62px;top:236px;width:360px;height:280px" alt="Focus zone">
  <img class="capture" src="../source-images/v3-components/projects-zone.png" style="left:450px;top:286px;width:372px;height:292px" alt="Projects zone">
  <img class="capture" src="../source-images/v3-components/inbox-zone.png" style="left:850px;top:224px;width:340px;height:256px" alt="Inbox zone">
  <img class="capture" src="../source-images/v3-components/clock-widget.png" style="left:1120px;top:164px;width:420px;height:230px" alt="Clock and date widget">
  <img class="capture" src="../source-images/v3-components/quick-note-widget.png" style="left:1090px;top:432px;width:420px;height:280px" alt="Quick note widget">

  <div class="abs" style="left:62px;bottom:54px">
    <span class="chip"><i></i>Desktop zones</span>&nbsp;&nbsp;
    <span class="chip"><i></i>Local widgets</span>&nbsp;&nbsp;
    <span class="chip"><i></i>Independent profiles</span>
  </div>
  <div class="abs note" style="right:62px;bottom:60px;font-size:17px">Authentic V3 UI · synthetic sample data</div>
</div>
</body>
</html>
