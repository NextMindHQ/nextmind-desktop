name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: filesystem
    attributes:
      label: Would this change how files are moved, renamed or deleted?
      description: Such changes get extra scrutiny (see CONTRIBUTING.md).
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
